name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-build:
    name: ${{ matrix.os }} core build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVegaFEM_BUILD_MODEL_REDUCTION=OFF
          -DVegaFEM_ENABLE_OpenGL_SUPPORT=OFF
          -DVegaFEM_ENABLE_PTHREADS_SUPPORT=OFF
          -DVegaFEM_BUILD_UTILITIES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Linux utility smoke test
        if: runner.os == 'Linux'
        run: |
          ./build/bin/generateMassMatrix \
            examples/turtle/model/turtle-volumetric-homogeneous.veg \
            turtle-mass.matrix
          test -s turtle-mass.matrix

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: vegafem-${{ runner.os }}-x64
          path: |
            build/bin
            build/lib
          if-no-files-found: error

  reduced-demo-build:
    name: Linux reduced StVK demo build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            freeglut3-dev \
            libgl1-mesa-dev \
            libglew-dev \
            liblapacke-dev \
            libopenblas-dev \
            libxmu-dev \
            xvfb

      - name: Configure Cg-free reduced demo
        run: >-
          cmake -S . -B build-reduced-demo -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVegaFEM_BUILD_MODEL_REDUCTION=ON
          -DVegaFEM_ENABLE_OpenGL_SUPPORT=ON
          -DVegaFEM_ENABLE_Cg_SUPPORT=OFF
          -DVegaFEM_BUILD_UTILITIES=ON

      - name: Build Cg-free reduced demo
        run: cmake --build build-reduced-demo --target reducedDynamicSolver-rt --parallel

      - name: Run simpleBridge demo smoke test
        working-directory: src/util/reducedDynamicSolver-rt
        run: |
          set +e
          timeout 10s xvfb-run -a ../../../build-reduced-demo/bin/reducedDynamicSolver-rt \
            realtime/simpleBridge/simpleBridge.config 2>&1 | tee simpleBridge.log
          demo_status=${PIPESTATUS[0]}
          set -e
          test "$demo_status" -eq 124
          grep -F "Starting application." simpleBridge.log
          grep -F "System lowest frequency is:" simpleBridge.log

      - name: Upload reduced demo bundle
        uses: actions/upload-artifact@v4
        with:
          name: reduced-stvk-bridge-linux-x64
          path: |
            build-reduced-demo/bin/reducedDynamicSolver-rt
            build-reduced-demo/lib
            src/util/reducedDynamicSolver-rt/realtime
          if-no-files-found: error
