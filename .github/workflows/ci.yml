name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-build:
    name: ${{ matrix.os }} core build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVegaFEM_BUILD_MODEL_REDUCTION=OFF
          -DVegaFEM_ENABLE_OpenGL_SUPPORT=OFF
          -DVegaFEM_ENABLE_PTHREADS_SUPPORT=OFF
          -DVegaFEM_BUILD_UTILITIES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Linux utility smoke test
        if: runner.os == 'Linux'
        run: |
          ./build/bin/generateMassMatrix \
            examples/turtle/model/turtle-volumetric-homogeneous.veg \
            turtle-mass.matrix
          test -s turtle-mass.matrix

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: vegafem-${{ runner.os }}-x64
          path: |
            build/bin
            build/lib
          if-no-files-found: error

  reduced-demo-build:
    name: Linux reduced StVK demo build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            freeglut3-dev \
            libgl1-mesa-dev \
            libglew-dev \
            liblapacke-dev \
            libopenblas-dev \
            libxmu-dev \
            xvfb

      - name: Configure Cg-free reduced demo
        run: >-
          cmake -S . -B build-reduced-demo -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVegaFEM_BUILD_MODEL_REDUCTION=ON
          -DVegaFEM_ENABLE_OpenGL_SUPPORT=ON
          -DVegaFEM_ENABLE_Cg_SUPPORT=OFF
          -DVegaFEM_BUILD_UTILITIES=ON

      - name: Build Cg-free reduced demo
        run: cmake --build build-reduced-demo --target reducedDynamicSolver-rt --parallel

      - name: Bundle demo runtime dependencies
        run: |
          mkdir -p build-reduced-demo/runtime-libs
          cp -L "$(ldconfig -p | awk '/libopenblas\.so\.0/{print $NF; exit}')" \
            build-reduced-demo/runtime-libs/libopenblas.so.0
          cp -L "$(ldconfig -p | awk '/libglut\.so\.3\.12/{print $NF; exit}')" \
            build-reduced-demo/runtime-libs/libglut.so.3.12

      - name: Run simpleBridge demo smoke test
        working-directory: src/util/reducedDynamicSolver-rt
        run: |
          set +e
          timeout 90s xvfb-run -a stdbuf -oL -eL \
            ../../../build-reduced-demo/bin/reducedDynamicSolver-rt \
            realtime/simpleBridge/simpleBridge.config 2>&1 | tee simpleBridge.log
          demo_status=${PIPESTATUS[0]}
          set -e
          test "$demo_status" -eq 124
          grep -F "Starting application." simpleBridge.log
          grep -F "Graphics initialization complete." simpleBridge.log
          grep -F "Dear ImGui controls initialized." simpleBridge.log
          grep -F "Building the reduced stiffness matrix quadratic polynomials... r is 20" simpleBridge.log
          ! ldd ../../../build-reduced-demo/bin/reducedDynamicSolver-rt | grep -F "libglui"

      - name: Upload reduced demo bundle
        uses: actions/upload-artifact@v4
        with:
          name: reduced-stvk-bridge-linux-x64
          path: |
            build-reduced-demo/bin/reducedDynamicSolver-rt
            build-reduced-demo/lib
            build-reduced-demo/runtime-libs
            src/util/reducedDynamicSolver-rt/realtime
          if-no-files-found: error

  modern-backend-toolchain:
    name: Linux modern SDL2/Vulkan/SYCL toolchain check
    runs-on: ubuntu-latest
    # Intel publishes this image with the DPC++ compiler and SYCL runtime.
    # The hosted runner is intentionally used only for a compile/runtime
    # smoke test; physical Intel-GPU performance tests belong on a
    # self-hosted runner with /dev/dri access.
    container: intel/oneapi-toolkit:2026.1.0-devel-ubuntu24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native window and Vulkan development packages
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libsdl2-dev libvulkan-dev \
            mesa-vulkan-drivers

      - name: Configure modern backend check with icpx
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S . -B build-modern -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx \
            -DCMAKE_CXX_COMPILER=icpx \
            -DVegaFEM_BUILD_MODEL_REDUCTION=OFF \
            -DVegaFEM_ENABLE_OpenGL_SUPPORT=OFF \
            -DVegaFEM_ENABLE_PTHREADS_SUPPORT=OFF \
            -DVegaFEM_ENABLE_SYCL_SUPPORT=ON \
            -DVegaFEM_BUILD_MODERN_BACKEND_CHECK=ON \
            -DVegaFEM_BUILD_UTILITIES=ON

      - name: Build modern backend check
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build-modern --target vegaModernBackendCheck --parallel

      - name: Run modern backend check
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh
          ./build-modern/bin/vegaModernBackendCheck
